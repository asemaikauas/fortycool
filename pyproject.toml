[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortycool-agents"
version = "0.1.0"
description = "Evidence-first agent tools for the FortyCool data-center thermal digital twin"
requires-python = ">=3.11"
dependencies = [
  "earthengine-api>=1.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
fortycool = "fortycool_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
