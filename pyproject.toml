[build-system]
# >=83 rather than >=75: PYSEC-2026-3447 affects earlier releases, and some CI
# images still ship one.
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortycool-agents"
version = "0.1.0"
description = "Evidence-first agent tools for the FortyCool data-center thermal digital twin"
requires-python = ">=3.11"
dependencies = [
  "earthengine-api>=1.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  # <6 pre-approved a reportlab 5.x that does not exist yet, so a future major
  # release would install itself into the build with no review.
  "reportlab>=4,<5",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# The <9 pin excluded the release that fixes PYSEC-2026-1845, so the cap moves
# rather than holding the suite on a version with a known advisory.
dev = ["pytest>=9.0.3,<10", "pip-audit>=2.7,<3"]

[project.scripts]
fortycool = "fortycool_agents.cli:main"

[tool.vercel]
# Vercel's FastAPI runtime imports this ASGI application directly. Keeping the
# entry point here avoids a second wrapper module that could drift from the
# local and container launch commands.
entrypoint = "fortycool_agents.api:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dashboard's third-party assets are vendored under web/vendor so the page
# renders on a venue network that blocks or throttles a CDN. They have to ship
# with the package or an installed copy loads unstyled.
fortycool_agents = [
  "web/**/*.html",
  "web/**/*.css",
  "web/**/*.js",
  "web/**/*.png",
  "web/**/*.svg",
  "web/**/*.woff2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
