name: tests

# Runs on every push and every pull request, so the merge box shows a real
# result instead of only "no conflicts with base branch". Before this the test
# suite existed on one laptop: a change could break any of the 83 tests and be
# merged without anyone finding out.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to the same branch makes the previous run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >= 3.11, so test what it claims.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # Installed from pyproject rather than requirements.lock on purpose:
        # the lock pins platform-specific wheel hashes, so it is valid for the
        # machine that generated it and would fail here. Resolving the declared
        # ranges also surfaces an upstream release that breaks us.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check the vendored dashboard assets are present
        # The dashboard loads Tailwind, Leaflet and its fonts from this
        # directory rather than from a CDN. If it goes missing the page still
        # serves, unstyled, and no test would notice.
        run: |
          python - <<'CHECK'
          import pathlib, re, sys

          web = pathlib.Path("src/fortycool_agents/web")
          missing = []
          for page in sorted((web / "pages").glob("*.html")):
              html = page.read_text()
              for ref in re.findall(r'(?:src|href)="(\.\./vendor/[^"]+)"', html):
                  target = (page.parent / ref).resolve()
                  if not target.exists():
                      missing.append(f"{page.name} -> {ref}")
          remote = []
          for page in sorted((web / "pages").glob("*.html")):
              remote += re.findall(r'(?:src|href)="(https?://[^"]+)"', page.read_text())
          if missing:
              print("missing vendored assets:", *missing, sep="\n  ")
          if remote:
              print("pages still load from a remote host:", *sorted(set(remote)), sep="\n  ")
          sys.exit(1 if (missing or remote) else 0)
          CHECK
